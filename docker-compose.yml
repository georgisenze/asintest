services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: referentiel-structures-app
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
    environment:
      PHP_CLI_SERVER_WORKERS: 4
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-referentiel}
      POSTGRES_USER: ${DB_USERNAME:-referentiel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-referentiel}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${DB_PORT_EXTERNE:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
